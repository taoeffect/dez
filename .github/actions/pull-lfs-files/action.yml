# Gets the Git LFS files of the repository: the sound files and the fonts.
# Every build needs all of them. Run it after a checkout without
# `lfs: true`, which leaves a small pointer file in the place of every LFS
# file.
#
# Why not `lfs: true`: it downloads the files (about 60 MB, most of it the
# fonts) in every job, and GitHub counts each download against the LFS
# bandwidth of the repository. The cache of this action keeps the LFS
# objects, and `git lfs pull` downloads nothing that the local LFS store
# has, so a run that finds the cache downloads nothing.
#
# The files are the same for every platform, so the cache key names no
# platform. A run finds only the caches of its own branch or tag and of
# the default branch (a GitHub rule).
#
# The build needs the real files: Vite inlines the sound with no error when
# it is a pointer file (only the sound then fails to play), and
# src-tauri/build.rs stops the build when a font is not the file that
# src-tauri/fonts/manifest.json names.
#
# The ffmpeg and ffprobe programs are not in Git LFS: the fetch-programs
# action gets them.
name: Pull the Git LFS files
description: >-
  Gets the sound files and the fonts from Git LFS, with a cache of the LFS
  objects.

runs:
  using: composite
  steps:
    # The key changes when a sound or a font changes: the hash is over the
    # pointer files of the sounds and over the manifest of the fonts, which
    # has the SHA-256 of every font.
    - name: Cache Git LFS objects
      uses: actions/cache@v6
      with:
        path: .git/lfs/objects
        key: git-lfs-${{ hashFiles('src/assets/sounds/**', 'src-tauri/fonts/manifest.json') }}

    - name: Pull Git LFS files
      shell: bash
      run: git lfs pull --include="src/assets/sounds/*,src-tauri/fonts/*"
