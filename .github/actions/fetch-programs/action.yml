# Gets the programs that Dez ships (ffmpeg, ffprobe, Deno) and the native
# file of skia-canvas for one build target. They are not in Git:
# scripts/fetch-programs.js downloads each one from the URL that
# src-tauri/binaries/manifest.json or src-tauri/libs/manifest.json pins for
# it, and takes only a file with the pinned size and SHA-256. Run it after
# the checkout and the Node setup; the script needs no npm package.
#
# The npm scripts that build Dez run the same script first, so a job would
# get the files without this action. The action adds the cache, and a step
# of its own that fails when a download fails. A run that finds the cache
# downloads nothing (the files of one target are about 190 to 240 MB). The
# script checks the files of a cache as it checks every file, and downloads
# a file again that does not match its pin.
#
# A run finds only the caches of its own branch or tag and of the default
# branch (a GitHub rule). So a release run finds the x86_64 Linux cache of
# the E2E runs on master, and downloads the files of the other two
# targets once.
#
# The download needs no token: the releases that the manifests name (the
# build repository of scripts/update-ffmpeg.js, the Deno repository) and
# the npm registry are public.
name: Fetch the bundled programs of one platform
description: >-
  Gets the ffmpeg, ffprobe, and Deno programs and the native file of
  skia-canvas of one build target, checked against
  src-tauri/binaries/manifest.json and src-tauri/libs/manifest.json, with a
  cache of the files.

inputs:
  target:
    description: >-
      The Rust target triple of the build, as in the file names of
      src-tauri/binaries/ (for example x86_64-unknown-linux-gnu).
    required: true

runs:
  using: composite
  steps:
    # The key changes when a file changes: the manifests have the SHA-256 of
    # every file.
    - name: Cache bundled programs
      uses: actions/cache@v6
      with:
        path: |
          src-tauri/binaries/dez-*-${{ inputs.target }}
          src-tauri/libs/skia-canvas/lib/skia.node
        key: bundled-programs-${{ inputs.target }}-${{ hashFiles('src-tauri/binaries/manifest.json', 'src-tauri/libs/manifest.json') }}

    - name: Fetch bundled programs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: node scripts/fetch-programs.js --target "$TARGET"
