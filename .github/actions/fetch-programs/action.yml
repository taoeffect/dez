# Gets the programs that Dez ships (ffmpeg and ffprobe) for one build
# target. They are not in Git: scripts/fetch-programs.js downloads each one
# from the URL that src-tauri/binaries/manifest.json pins for it, and takes
# only a file with the pinned size and SHA-256. Run it after the checkout
# and the Node setup; the script needs no npm package.
#
# The npm scripts that build Dez run the same script first, so a job would
# get the programs without this action. The action adds the cache, and a
# step of its own that fails when a download fails. A run that finds the
# cache downloads nothing (the two programs of one target are about 70 to
# 96 MB). The script checks the files of a cache as it checks every file,
# and downloads a file again that does not match its pin.
#
# A run finds only the caches of its own branch or tag and of the default
# branch (a GitHub rule). So a release run finds the x86_64 Linux cache of
# the E2E runs on master, and downloads the files of the other two
# targets once.
#
# The download needs no token: the releases of the build repository
# (scripts/update-ffmpeg.js) are public.
name: Fetch the bundled programs of one platform
description: >-
  Gets the ffmpeg and ffprobe programs of one build target, checked against
  src-tauri/binaries/manifest.json, with a cache of the files.

inputs:
  target:
    description: >-
      The Rust target triple of the build, as in the file names of
      src-tauri/binaries/ (for example x86_64-unknown-linux-gnu).
    required: true

runs:
  using: composite
  steps:
    # The key changes when a program changes: the manifest has the SHA-256
    # of every program.
    - name: Cache bundled programs
      uses: actions/cache@v6
      with:
        path: src-tauri/binaries/dez-*-${{ inputs.target }}
        key: bundled-programs-${{ inputs.target }}-${{ hashFiles('src-tauri/binaries/manifest.json') }}

    - name: Fetch bundled programs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: node scripts/fetch-programs.js --target "$TARGET"
