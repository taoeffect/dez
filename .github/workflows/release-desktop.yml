name: Release desktop builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Every job removes the compromised eMudhra CA roots in its first step,
# before any network request. Ubuntu jobs use the shared okTurtles
# fix-ubuntu-ca-roots action and set NODE_OPTIONS: --use-openssl-ca in the
# job env. The macOS job runs its own inline fix. A new job must do the
# same. The e2e gate gets the fix and NODE_OPTIONS from e2e.yml.
jobs:
  # Stops a release whose tag does not match the version files. Tauri names
  # the bundles (the DMG too) with the tauri.conf.json version, and the app
  # shows the package.json version in About and in the update check, so a
  # tag pushed without `npm run bump-version` gives binaries of the old
  # version: v0.12.1 shipped Dez_0.12.0_aarch64.dmg, and its binaries
  # offered v0.12.1 as an update. Runs first, so a wrong tag fails fast.
  version-check:
    name: Check version files against the tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script uses only Node built-ins, so no npm ci.
      - name: Check version files
        run: node scripts/bump-version.js --check "$GITHUB_REF_NAME"

  # Gate all release builds on the E2E UI tests passing for the tagged
  # commit; builds below only start when this reusable workflow succeeds.
  e2e:
    name: E2E gate
    needs: version-check
    uses: ./.github/workflows/e2e.yml

  build-linux-appimage:
    name: Build Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: e2e

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            artifact: dez-linux-x86_64-appimage
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact: dez-linux-arm64-appimage

    # The first step and NODE_OPTIONS: the same CA root fix as in e2e.yml,
    # see the comments there. NODE_OPTIONS is set per Ubuntu job, not in the
    # workflow env as the action asks, so it does not reach the macOS job:
    # --use-openssl-ca was never tested on macOS.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:linux:appimage

      - name: Stage AppImage release asset
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)

          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}"
            printf '%s\n' "${appimages[@]}"
            exit 1
          fi

          cp "${appimages[0]}" "release-assets/Dez_${version}_linux_${{ matrix.arch }}.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*.AppImage
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-latest
    needs: e2e

    env:
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      # Remove the compromised eMudhra roots (plus the Comodo AAA root that
      # curl's fix also drops) from the runner's preinstalled /etc/ssl/cert.pem
      # before anything makes a TLS request. Inlined rather than used as a
      # local (./) composite action so it can run before checkout. The shared
      # fix-ubuntu-ca-roots action that the Linux jobs use is for Ubuntu only.
      # Each awk pass drops one named `=== ` block from the bundle; the result
      # is only installed if it is non-empty.
      # https://emudhra.we-have-a-problem.com/#macos-curl
      # https://raw.githubusercontent.com/curl/curl/f0da5390ad9d380807cc83e600196809df8bb96b/.github/actions/macos-fix-certs/action.yml
      - name: Fix macOS runner CA root bundle
        shell: bash
        run: |
          ls -lA /etc/ssl/cert.pem
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # build:macos:dmg first runs scripts/build-macos-icon.js, which compiles
      # the app icon with actool. Only actool from Xcode 26 or newer reads
      # .icon documents. When the runner's default Xcode is older, select the
      # newest installed release Xcode (named like Xcode_26.3.app; betas are
      # skipped). The script fails with a clear message if actool is still
      # too old.
      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          major="$(xcrun actool --version --output-format human-readable-text < /dev/null |
            awk -F': ' '/short-bundle-version/ { split($2, v, "."); print v[1] }' || true)"
          echo "Default actool major version: ${major:-unknown}"
          if [ "${major:-0}" -lt 26 ]; then
            xcode="$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n 1)"
            echo "Selecting ${xcode}"
            sudo xcode-select -s "${xcode}"
          fi
          xcodebuild -version

      - name: Build unsigned Apple Silicon DMG
        run: npm run build:macos:dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dez-macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Writes the release body: the notes template, then the changes that the
  # REVIEW_MODEL model writes from the commits since the previous release
  # (scripts/release-notes.js). REVIEW_MODEL and REVIEW_PROVIDER are
  # variables of the Default environment. ZAI_API_KEY is also a repository
  # secret, so the environment does not limit it: only the "Write release
  # notes" step may reference it. Never reference it, or use
  # `secrets: inherit`, in another job. This job runs no npm ci: the script
  # uses only Node built-ins, so no third-party package code runs next to
  # the key. If it fails, publish-release does not run, so no release is
  # made. "Re-run failed jobs" then retries both without a rebuild: a
  # partial re-run keeps the artifacts of the jobs that passed. If the
  # release already exists, the job writes no notes (publish-release keeps
  # the existing ones), so a model failure cannot stop the asset upload.
  release-notes:
    name: Write release notes
    runs-on: ubuntu-22.04
    needs: e2e
    environment: Default
    permissions:
      contents: read
    outputs:
      release-exists: ${{ steps.existing.outputs.exists }}

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      # The full history and tags: the script finds the previous release tag
      # and reads the commit messages since it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A failed check counts as "no release": then the notes are written,
      # so publish-release can still create the release. publish-release
      # checks again before it creates the release. The read-only token of
      # this job does not see draft releases, so a draft still gets notes.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node scripts/release-notes.js "$TAG_NAME" --out release-notes.md

      - name: Upload release notes artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-22.04
    needs:
      - build-linux-appimage
      - build-macos-dmg
      - release-notes

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Download x86_64 AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: dez-linux-x86_64-appimage
          path: release-assets

      - name: Download ARM64 AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: dez-linux-arm64-appimage
          path: release-assets

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: dez-macos-aarch64-dmg
          path: release-assets

      - name: Download release notes artifact
        if: needs.release-notes.outputs.release-exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      # An existing release keeps its notes: a maintainer may have edited
      # them. To write new notes for it, run scripts/release-notes.js on a
      # local machine and use gh release edit --notes-file.
      - name: Create release if needed
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes/release-notes.md
          fi

      - name: Upload release assets
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
