name: Release desktop builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate all release builds on the E2E UI tests passing for the tagged
  # commit; builds below only start when this reusable workflow succeeds.
  e2e:
    name: E2E gate
    uses: ./.github/workflows/e2e.yml

  build-linux-appimage:
    name: Build Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: e2e

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            artifact: dez-linux-x86_64-appimage
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact: dez-linux-arm64-appimage

    # The first step and NODE_OPTIONS: the same CA root fix as in e2e.yml,
    # see the comments there. NODE_OPTIONS is set per Ubuntu job, not in the
    # workflow env as the action asks, so it does not reach the macOS job:
    # --use-openssl-ca was never tested on macOS.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:linux:appimage

      - name: Stage AppImage release asset
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)

          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}"
            printf '%s\n' "${appimages[@]}"
            exit 1
          fi

          cp "${appimages[0]}" "release-assets/Dez_${version}_linux_${{ matrix.arch }}.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*.AppImage
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-latest
    needs: e2e

    env:
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      # Remove the compromised eMudhra roots (plus the Comodo AAA root that
      # curl's fix also drops) from the runner's preinstalled /etc/ssl/cert.pem
      # before anything makes a TLS request. Inlined rather than used as a
      # local (./) composite action so it can run before checkout. The shared
      # fix-ubuntu-ca-roots action that the Linux jobs use is for Ubuntu only.
      # Each awk pass drops one named `=== ` block from the bundle; the result
      # is only installed if it is non-empty.
      # https://emudhra.we-have-a-problem.com/#macos-curl
      # https://raw.githubusercontent.com/curl/curl/f0da5390ad9d380807cc83e600196809df8bb96b/.github/actions/macos-fix-certs/action.yml
      - name: Fix macOS runner CA root bundle
        shell: bash
        run: |
          ls -lA /etc/ssl/cert.pem
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned Apple Silicon DMG
        run: npm run build:macos:dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dez-macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-22.04
    needs:
      - build-linux-appimage
      - build-macos-dmg

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x86_64 AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: dez-linux-x86_64-appimage
          path: release-assets

      - name: Download ARM64 AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: dez-linux-arm64-appimage
          path: release-assets

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: dez-macos-aarch64-dmg
          path: release-assets

      - name: Create release if needed
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file .github/release-notes-template.md
          fi

      - name: Upload release assets
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
