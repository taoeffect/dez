name: Release desktop builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Every job removes the compromised eMudhra CA roots in its first step,
# before any network request. Ubuntu jobs use the shared okTurtles
# fix-ubuntu-ca-roots action and set NODE_OPTIONS: --use-openssl-ca in the
# job env. The macOS job runs its own inline fix. A new job must do the
# same. The e2e gate gets the fix and NODE_OPTIONS from e2e.yml.
#
# Secrets: only the "Write release notes" step may reference ZAI_API_KEY,
# and only the "Sign DMG" step may reference MINISIGN_SECRET_KEY. The
# comments above the release-notes and sign-macos-dmg jobs give the reasons.
#
# Each job's timeout-minutes is 3x its run time in the v0.13.0 release,
# rounded up, so a stuck step (an apt install once hung for 25 minutes)
# fails in minutes, not after GitHub's 6-hour default. The e2e gate's
# timeout is in e2e.yml.
jobs:
  # Stops a release whose tag does not match the version files. Tauri names
  # the bundles (the DMG too) with the tauri.conf.json version, and the app
  # shows the package.json version in About and in the update check, so a
  # tag pushed without `npm run bump-version` gives binaries of the old
  # version: v0.12.1 shipped Dez_0.12.0_aarch64.dmg, and its binaries
  # offered v0.12.1 as an update. Runs first, so a wrong tag fails fast.
  version-check:
    name: Check version files against the tag
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      contents: read

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script uses only Node built-ins, so no npm ci.
      - name: Check version files
        run: node scripts/bump-version.js --check "$GITHUB_REF_NAME"

  # Gate all release builds on the E2E UI tests passing for the tagged
  # commit; builds below only start when this reusable workflow succeeds.
  e2e:
    name: E2E gate
    needs: version-check
    uses: ./.github/workflows/e2e.yml

  build-linux-appimage:
    name: Build Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: e2e
    timeout-minutes: ${{ matrix.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            artifact: dez-linux-x86_64-appimage
            timeout-minutes: 14
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact: dez-linux-arm64-appimage
            timeout-minutes: 19

    # The first step and NODE_OPTIONS: the same CA root fix as in e2e.yml,
    # see the comments there. NODE_OPTIONS is set per Ubuntu job, not in the
    # workflow env as the action asks, so it does not reach the macOS job:
    # --use-openssl-ca was never tested on macOS.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      # `lfs: true`: the build inlines the Git LFS file
      # src/assets/sounds/ding.mp3 (see the checkout comment in e2e.yml).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # bundleMediaFramework (tauri.conf.json) copies the GStreamer plugins
      # of this runner into the AppImage, so that the AppImage can play the
      # reply-done sound (MP3 needs mpg123audiodec from plugins-good).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:linux:appimage

      - name: Stage AppImage release asset
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)

          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}"
            printf '%s\n' "${appimages[@]}"
            exit 1
          fi

          cp "${appimages[0]}" "release-assets/Dez_${version}_linux_${{ matrix.arch }}.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*.AppImage
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-latest
    needs: e2e
    timeout-minutes: 11

    env:
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      # Remove the compromised eMudhra roots (plus the Comodo AAA root that
      # curl's fix also drops) from the runner's preinstalled /etc/ssl/cert.pem
      # before anything makes a TLS request. Inlined rather than used as a
      # local (./) composite action so it can run before checkout. The shared
      # fix-ubuntu-ca-roots action that the Linux jobs use is for Ubuntu only.
      # Each awk pass drops one named `=== ` block from the bundle; the result
      # is only installed if it is non-empty.
      # https://emudhra.we-have-a-problem.com/#macos-curl
      # https://raw.githubusercontent.com/curl/curl/f0da5390ad9d380807cc83e600196809df8bb96b/.github/actions/macos-fix-certs/action.yml
      - name: Fix macOS runner CA root bundle
        shell: bash
        run: |
          ls -lA /etc/ssl/cert.pem
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem

      # `lfs: true`: the build inlines the Git LFS file
      # src/assets/sounds/ding.mp3 (see the checkout comment in e2e.yml).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # build:macos:dmg first runs scripts/build-macos-icon.js, which compiles
      # the app icon with actool. Only actool from Xcode 26 or newer reads
      # .icon documents. When the runner's default Xcode is older, select the
      # newest installed release Xcode (named like Xcode_26.3.app; betas are
      # skipped). The script fails with a clear message if actool is still
      # too old.
      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          major="$(xcrun actool --version --output-format human-readable-text < /dev/null |
            awk -F': ' '/short-bundle-version/ { split($2, v, "."); print v[1] }' || true)"
          echo "Default actool major version: ${major:-unknown}"
          if [ "${major:-0}" -lt 26 ]; then
            xcode="$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n 1)"
            echo "Selecting ${xcode}"
            sudo xcode-select -s "${xcode}"
          fi
          xcodebuild -version

      - name: Build unsigned Apple Silicon DMG
        run: npm run build:macos:dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: dez-macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Signs the DMG for the macOS updater. An installed Dez downloads
  # Dez_<version>_aarch64.dmg and its .minisig from the release, and it
  # installs the DMG only if the signature verifies against the public key
  # that it compiles in from src-tauri/updater/minisign.pub. So a release
  # with no .minisig cannot update macOS installs, and publish-release waits
  # for this job.
  #
  # MINISIGN_SECRET_KEY is a secret of the Default environment: the text of
  # the unencrypted secret key file that `minisign -G -W` writes. Only the
  # "Sign DMG" step may reference it. Never reference it, or use
  # `secrets: inherit`, in another job. The signing is a job of its own, so
  # that the key never shares a runner with npm ci or the build: this job
  # runs only the CA fix, GitHub's checkout and artifact actions, and
  # Ubuntu's minisign. Ubuntu 24.04, because its minisign is 0.11, the first
  # version that reads a key with no password; 22.04 has 0.9.
  #
  # The job is newer than the v0.13.0 release, so its timeout is a guess
  # (two apt runs and a DMG download), not 3x a measured run.
  sign-macos-dmg:
    name: Sign macOS DMG
    runs-on: ubuntu-24.04
    needs: build-macos-dmg
    timeout-minutes: 5
    environment: Default
    permissions:
      contents: read

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      # Only for src-tauri/updater/minisign.pub: the verify step checks the
      # signature against the key that the app compiles in.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      - name: Download DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: dez-macos-aarch64-dmg
          path: dmg

      # The key goes into a mktemp file (mode 0600) under RUNNER_TEMP, and
      # the EXIT trap deletes it when the step ends, also on a failure.
      # stdin is /dev/null, so a key that has a password fails the step
      # instead of waiting for the password.
      - name: Sign DMG
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dmg/Dez_${version}_aarch64.dmg"
          if [ ! -f "$dmg" ]; then
            echo "Expected $dmg, found:"
            ls -l dmg
            exit 1
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The Default environment has no MINISIGN_SECRET_KEY secret"
            exit 1
          fi
          key="$(mktemp "$RUNNER_TEMP/minisign-key.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m "$dmg" \
            -t "Dez ${version} Dez_${version}_aarch64.dmg" < /dev/null

      # -H rejects a legacy (not prehashed) signature, as the app does.
      # minisign has made prehashed signatures by default since 0.10.
      - name: Verify signature
        run: |
          version="${GITHUB_REF_NAME#v}"
          minisign -V -H -p src-tauri/updater/minisign.pub \
            -m "dmg/Dez_${version}_aarch64.dmg"

      - name: Upload signature artifact
        uses: actions/upload-artifact@v7
        with:
          name: dez-macos-aarch64-dmg-minisig
          path: dmg/*.minisig
          if-no-files-found: error

  # Writes the release body: the notes template, then the changes that the
  # REVIEW_MODEL model writes from the commits since the previous release
  # (scripts/release-notes.js). REVIEW_MODEL and REVIEW_PROVIDER are
  # variables of the Default environment. ZAI_API_KEY is also a repository
  # secret, so the environment does not limit it: only the "Write release
  # notes" step may reference it. Never reference it, or use
  # `secrets: inherit`, in another job. This job runs no npm ci: the script
  # uses only Node built-ins, so no third-party package code runs next to
  # the key. If it fails, publish-release does not run, so no release is
  # made. "Re-run failed jobs" then retries both without a rebuild: a
  # partial re-run keeps the artifacts of the jobs that passed. If the
  # release already exists, the job writes no notes (publish-release keeps
  # the existing ones), so a model failure cannot stop the asset upload.
  release-notes:
    name: Write release notes
    runs-on: ubuntu-22.04
    needs: e2e
    timeout-minutes: 4
    environment: Default
    permissions:
      contents: read
    outputs:
      release-exists: ${{ steps.existing.outputs.exists }}

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      # The full history and tags: the script finds the previous release tag
      # and reads the commit messages since it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A failed check counts as "no release": then the notes are written,
      # so publish-release can still create the release. publish-release
      # checks again before it creates the release. The read-only token of
      # this job does not see draft releases, so a draft still gets notes.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node scripts/release-notes.js "$TAG_NAME" --out release-notes.md

      - name: Upload release notes artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-22.04
    needs:
      - build-linux-appimage
      - build-macos-dmg
      - sign-macos-dmg
      - release-notes
    timeout-minutes: 3

    # The first step and NODE_OPTIONS: see build-linux-appimage.
    env:
      NODE_OPTIONS: --use-openssl-ca
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Fix Ubuntu runner CA root bundle
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Download x86_64 AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: dez-linux-x86_64-appimage
          path: release-assets

      - name: Download ARM64 AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: dez-linux-arm64-appimage
          path: release-assets

      - name: Download DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: dez-macos-aarch64-dmg
          path: release-assets

      - name: Download DMG signature artifact
        uses: actions/download-artifact@v8
        with:
          name: dez-macos-aarch64-dmg-minisig
          path: release-assets

      - name: Download release notes artifact
        if: needs.release-notes.outputs.release-exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      # An existing release keeps its notes: a maintainer may have edited
      # them. To write new notes for it, run scripts/release-notes.js on a
      # local machine and use gh release edit --notes-file.
      - name: Create release if needed
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes/release-notes.md
          fi

      - name: Upload release assets
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
