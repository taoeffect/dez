name: E2E UI tests

on:
  pull_request:
  push:
    branches:
      - master
  # Reusable entry point so the release workflow can gate builds on these
  # tests passing for the tagged commit.
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node must use the system CA bundle that fix-ubuntu-ca-roots fixes. A
  # reusable workflow does not get its caller's env, so this one sets it.
  # See the header of the action's action.yml for all the rules.
  NODE_OPTIONS: --use-openssl-ca

# Every job removes the compromised eMudhra CA roots in its first step,
# before any network request (see the e2e job). A new job must do the same.
jobs:
  e2e:
    name: E2E (Linux, WebDriver, ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    # 3x the run time in the v0.13.0 release, rounded up. That run was from
    # before the shards, when one runner ran all the specs.
    timeout-minutes: 46

    # The specs run one file at a time, so six runners each run about a
    # sixth of the files (`vitest --shard`). Vitest splits by file count,
    # not by run time. The 6 in `name` and in the test step must match the
    # length of `shard`.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    env:
      # Pin the native WebDriver so tauri-driver never has to guess its
      # location; the webkit2gtk-driver apt package installs it here.
      DEZ_E2E_NATIVE_DRIVER: /usr/bin/WebKitWebDriver

    steps:
      # Must be the first step, before any HTTPS request. Shared by all
      # okTurtles repos; its action.yml header gives the reasons and rules.
      # https://github.com/okTurtles/libcheloniajs/blob/main/.github/actions/fix-ubuntu-ca-roots/action.yml
      - name: Fix Ubuntu runner CA root bundle
        id: ca-roots
        uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      # The build inlines src/assets/sounds/ding.mp3, which is in Git LFS.
      # Without `lfs: true` the file is the LFS pointer text, and the build
      # inlines that with no error; only the sound fails to play.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Fail fast on harness/spec type errors before the slow native steps
      # (apt + cargo + tauri build). Needs only the npm-installed typescript.
      - name: Type-check E2E harness
        run: npm run typecheck:e2e

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Must run before `cargo install tauri-driver` so the installed
      # binary (in ~/.cargo/bin) and the build target dir are cached.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # All shards build the same thing and share one cache key, so
          # only one of them saves it.
          save-if: ${{ matrix.shard == 1 }}

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # dbus-daemon and python3-gi run the fake notification server of
      # tests/e2e/harness/notificationServer.py. WebKitGTK plays sound and
      # video with GStreamer. gstreamer1.0-plugins-good has the MP3 decoder
      # (mpg123audiodec) of the reply-done sound, and the WAV parser and the
      # WebM demuxer with the VP9 decoder of the clips of
      # tests/e2e/media-player.e2e.ts.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            webkit2gtk-driver \
            xvfb \
            dbus-daemon \
            python3-gi \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Build debug app (no bundle)
        run: npm run tauri build -- --debug --no-bundle

      - name: Run E2E tests under Xvfb
        run: xvfb-run -a npm run test:e2e -- --shard=${{ matrix.shard }}/6

      # upload-artifact sends the runtime token over HTTPS, so skip it when
      # the CA fix failed and the bundle can still trust a removed root.
      - name: Upload failure screenshots
        if: failure() && steps.ca-roots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-screenshots-${{ matrix.shard }}
          path: tests/e2e/artifacts/*.png
          if-no-files-found: ignore
