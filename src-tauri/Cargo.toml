[package]
name = "dez"
version = "0.61.0"
description = "A friendly chat interface to various LLMs"
authors = ["Greg Slepak w/AI"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# sha2 and serde_json, at the versions that tauri already builds: build.rs
# checks the bundled programs (binaries/) against binaries/manifest.json
# with them.
[build-dependencies]
# tauri-build copies the bundled programs (`bundle.externalBin`) next to the
# Dez program of a debug build. It must be 2.7 or newer: older versions take
# the third parent of OUT_DIR as the target folder, and the cargo of Rust
# 1.100 puts OUT_DIR one folder deeper, so the copies went into
# target/debug/build/ and every run of a bundled program failed.
# https://github.com/tauri-apps/tauri/pull/15831
tauri-build = { version = "=2.7.4", features = [] }
sha2 = "=0.10.9"
serde_json = "=1.0.149"

[dependencies]
# `devtools` lets release builds open the Web Inspector: Help › Developer
# Console calls `open_devtools` (commands.rs). Debug builds have it anyway.
# In release builds it also turns on Tauri's own inspector key (Ctrl+Shift+I
# on Linux, Cmd+Option+I on macOS) and the "Inspect Element" context menu
# item. WebKit keeps console messages from before the inspector opens, so
# the console shows earlier logs too. On macOS it uses a private WebKit API,
# which only blocks App Store distribution.
# `protocol-asset` serves files to the webview by `convertFileSrc` URLs:
# the stored images and clips (the folders under `~/.config/dez/assets/`),
# the temp copies of clips (`dez/media/` in the OS cache folder), and the
# images and clips that the user dropped and Dez linked in place (at any
# path). So the `assetProtocol` scope in tauri.conf.json allows every file
# (`/**`, with dot folders: `requireLiteralLeadingDot: false`). A desktop
# program can read the disk anyway, and Dez loads no remote code. It must
# never do so: such code could read any file through this scope, the API
# keys in `provider_keys.json` too.
tauri = { version = "=2.12.5", features = ["devtools", "protocol-asset"] }
# The Tauri CLI refuses a plugin crate and its npm package of different
# major.minor versions: keep opener, store, dialog, and fs equal on both sides.
tauri-plugin-opener = "=2.5.3"
tauri-plugin-store = "=2.4.2"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
# reqwest speaks TLS with rustls (the `ring` provider), not native-tls: on
# macOS native-tls is Apple's SecureTransport, which stops at TLS 1.2, and
# some servers take only TLS 1.3 (TrustedRouter: "bad protocol version").
# The roots are those of the OS store (rustls-native-certs: the keychain
# trust settings on macOS, the OpenSSL cert files on Linux, the system store
# on Windows), so Dez trusts what the OS trusts, company CAs too.
# `default-features = false` drops native-tls (and so OpenSSL on Linux); the
# other default features stay, by name.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls-native-roots"] }
tokio = { version = "=1.52.0", features = ["full"] }
thiserror = "=2.0.18"
futures = "=0.3.32"
# The base64 version that reqwest already pulls in: http_bridge.rs decodes
# a request body that the webview sends as base64 text.
base64 = "=0.22.1"
# The dirs version that tauri uses: persistence.rs finds the OS cache folder
# with it, as tauri does for `$CACHE`.
dirs = "=6.0.0"

# The gtk version that tauri uses, so its `gtk_window()` type matches. The
# zbus version that tauri-plugin-opener already pulls in: notification.rs
# talks to the desktop notification server with it, and idle.rs to GNOME's
# idle monitor. idle.rs reads the idle time from the Wayland compositor and
# the X server with pure-Rust protocol crates, so the build needs no new
# system library (no libwayland-client, libxcb, or libXss).
#
# landlock: confinement.rs builds the Landlock rules of a bundled program
# run with it (landlock 0.4.7 needs libc 0.2.186 or later).
#
# webkit2gtk: the version and the feature that wry uses. app_frames.rs adds
# the content rule list of the app frames to the webview with its C
# functions (`webkit2gtk::ffi`), and turns the link preconnect of the
# webview off. The crate has no feature API (WebKitGTK 2.42), so
# app_frames.rs declares those C functions itself: Dez needs WebKitGTK 2.42
# or newer, when it is built and when it runs.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = "=5.14.0"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
x11rb = { version = "=0.14.0", features = ["screensaver"] }
landlock = "=0.4.7"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# libc: on Linux, the raw calls that confine a bundled program in the child
# between fork and exec, where a crate's own call could allocate: the
# Landlock rules, the seccomp filter, the data limit (`setrlimit`), and the
# close of the inherited files (`close_range`) (confinement.rs); on macOS,
# the close of the inherited files there (`fcntl`, confinement.rs); on Linux
# and macOS, the kill of the process group of a bundled program run
# (bundled_tools.rs), and the open flags of a read in a place that programs
# own (persistence.rs).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# objc2, objc2-foundation: the versions that mac-notification-sys already
# uses. notification.rs posts the notifications and owns the notification
# center delegate with them; mac-notification-sys only sets the app id that
# the notifications post as. objc2-app-kit: the version that wry uses;
# commands.rs reads the paths of a file drag from the drag pasteboard with
# it (`dragged_file_paths`). objc2-web-kit, block2: the versions that wry
# uses; app_frames.rs adds the content rule list of the app frames to the
# webview with them, and turns the link preconnect and WebRTC of the
# webview off.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController"] }
block2 = "=0.6.2"

# build.rs hashes the bundled programs of the build target (150 to 200 MB)
# each time that cargo runs the build script again, for example after a
# change of tauri.conf.json or of a capability file. Cargo builds the
# dependencies of a build script with no optimization: the hash of 77 MB
# then took 2 s on an arm64 host, and takes 0.2 s with this. A package
# entry also applies to a build dependency.
[profile.dev.package.sha2]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

