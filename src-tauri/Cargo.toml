[package]
name = "dez"
version = "0.15.1"
description = "A friendly chat interface to various LLMs"
authors = ["Greg Slepak w/AI"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[features]
# For the macOS update smoke test only; release builds never enable it. The
# updater then trusts two throwaway keys and downloads from a local server,
# all three set at compile time (src/updater/verify.rs).
updater-test-hooks = []

[dependencies]
# `devtools` lets release builds open the Web Inspector: Help › Developer
# Console calls `open_devtools` (commands.rs). Debug builds have it anyway.
# In release builds it also turns on Tauri's own inspector key (Ctrl+Shift+I
# on Linux, Cmd+Option+I on macOS) and the "Inspect Element" context menu
# item. WebKit keeps console messages from before the inspector opens, so
# the console shows earlier logs too. On macOS it uses a private WebKit API,
# which only blocks App Store distribution.
# `protocol-asset` serves the images in `~/.config/dez/assets/images/` to the
# webview by `convertFileSrc` URLs (`assetProtocol` in tauri.conf.json).
tauri = { version = "=2.10.3", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-store = "=2.4.2"
# Later dialog (2.8+) and fs (2.6+) releases need tauri 2.12. The npm
# packages stay at 2.7.0 / 2.5.0, because their later patch releases need
# @tauri-apps/api 2.11. The Tauri CLI only requires the same major.minor.
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
tokio = { version = "=1.52.0", features = ["full"] }
thiserror = "=2.0.18"
futures = "=0.3.32"
# The macOS updater (src/updater/). minisign-verify: checks the two minisign
# signatures of a release (of its manifest, and of its version); zero
# dependencies, by the minisign author, and what Tauri's updater uses.
# semver: the version that Tauri already uses, so it compares with
# `PackageInfo::version`. tempfile: the version already in Cargo.lock; makes
# the private download dir and removes it when dropped. sha2: the version
# already in Cargo.lock (Tauri's crates use it); the SHA-256 of the update
# DMG, which the release manifest names.
minisign-verify = "=0.3.0"
semver = "=1.0.28"
tempfile = "=3.27.0"
sha2 = "=0.10.9"

# The gtk version that tauri uses, so its `gtk_window()` type matches. The
# zbus version that tauri-plugin-opener already pulls in: notification.rs
# talks to the desktop notification server with it, and idle.rs to GNOME's
# idle monitor. idle.rs reads the idle time from the Wayland compositor and
# the X server with pure-Rust protocol crates, so the build needs no new
# system library (no libwayland-client, libxcb, or libXss).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = "=5.14.0"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
x11rb = { version = "=0.14.0", features = ["screensaver"] }

# objc2, objc2-foundation: the versions that mac-notification-sys already
# uses. notification.rs posts the notifications and owns the notification
# center delegate with them; mac-notification-sys only sets the app id that
# the notifications post as.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
# plist, libc: the versions already in Cargo.lock. The updater
# (src/updater/macos.rs) reads plists with plist: the Info.plist of an app
# bundle and the output of `diskutil info -plist`. With libc it asks whether
# the app is on a read-only volume (statvfs), swaps the app bundles
# (renamex_np with RENAME_SWAP), and detaches the relaunch helper (setsid).
plist = "=1.8.0"
libc = "=0.2.185"

