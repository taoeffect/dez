[package]
name = "dez"
version = "0.15.1"
description = "A friendly chat interface to various LLMs"
authors = ["Greg Slepak w/AI"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
# `devtools` lets release builds open the Web Inspector: Help › Developer
# Console calls `open_devtools` (commands.rs). Debug builds have it anyway.
# In release builds it also turns on Tauri's own inspector key (Ctrl+Shift+I
# on Linux, Cmd+Option+I on macOS) and the "Inspect Element" context menu
# item. WebKit keeps console messages from before the inspector opens, so
# the console shows earlier logs too. On macOS it uses a private WebKit API,
# which only blocks App Store distribution.
# `protocol-asset` serves the images in `~/.config/dez/assets/images/` and
# the media in `~/.config/dez/assets/generated/` to the webview by
# `convertFileSrc` URLs (`assetProtocol` in tauri.conf.json).
# `macos-private-api` (with `macOSPrivateApi` in tauri.conf.json, which must
# agree with it) makes wry set WKWebView's `fullScreenEnabled` preference,
# which is off by default. Without it the fullscreen button of a video
# player (MediaPlayer.vue) does nothing on macOS: `document.fullscreenEnabled`
# is false, so `requestFullscreen()` is refused. It is a private WebKit API
# too, as `devtools` is. It also lets a window be transparent, which Dez
# does not use. Other platforms ignore it.
tauri = { version = "=2.10.3", features = ["devtools", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-store = "=2.4.2"
# Later dialog (2.8+) and fs (2.6+) releases need tauri 2.12. The npm
# packages stay at 2.7.0 / 2.5.0, because their later patch releases need
# @tauri-apps/api 2.11. The Tauri CLI only requires the same major.minor.
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
tokio = { version = "=1.52.0", features = ["full"] }
thiserror = "=2.0.18"
futures = "=0.3.32"
# The dirs version that tauri uses: persistence.rs finds the OS cache folder
# with it, as tauri does for `$CACHE` in the asset scope of tauri.conf.json.
dirs = "=6.0.0"

# The gtk version that tauri uses, so its `gtk_window()` type matches. The
# zbus version that tauri-plugin-opener already pulls in: notification.rs
# talks to the desktop notification server with it, and idle.rs to GNOME's
# idle monitor. idle.rs reads the idle time from the Wayland compositor and
# the X server with pure-Rust protocol crates, so the build needs no new
# system library (no libwayland-client, libxcb, or libXss).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = "=5.14.0"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
x11rb = { version = "=0.14.0", features = ["screensaver"] }

# objc2, objc2-foundation: the versions that mac-notification-sys already
# uses. notification.rs posts the notifications and owns the notification
# center delegate with them; mac-notification-sys only sets the app id that
# the notifications post as.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"

