[package]
name = "dez"
version = "0.12.0"
description = "A friendly chat interface to various LLMs"
authors = ["Greg Slepak w/AI"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-store = "=2.4.2"
# Later dialog (2.8+) and fs (2.6+) releases need tauri 2.12. The npm
# packages stay at 2.7.0 / 2.5.0, because their later patch releases need
# @tauri-apps/api 2.11. The Tauri CLI only requires the same major.minor.
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
tokio = { version = "=1.52.0", features = ["full"] }
thiserror = "=2.0.18"
futures = "=0.3.32"

# The gtk version that tauri uses, so its `gtk_window()` type matches.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

