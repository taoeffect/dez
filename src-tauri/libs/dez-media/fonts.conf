<!-- The fontconfig file of a run that loads skia-canvas (FONTCONFIG_FILE,
     src-tauri/src/bundled_tools.rs). It names no font folder and no cache
     folder, so a canvas draws only the fonts that Dez ships (useShippedFonts,
     canvas.js). Without it, fontconfig writes an error on each run: it cannot
     open /etc/fonts/fonts.conf, which the OS rule of the run hides. -->
<fontconfig></fontconfig>
